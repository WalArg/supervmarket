name: SuperVmarket Daily Scraper

on:
  schedule:
    # 07:00 UTC = 04:00 AM hora de Argentina (todos los días)
    - cron: '0 7 * * *'
  workflow_dispatch: # Habilita el botón manual "Run workflow"

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Ultra-Fast Sitemap Scraper to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/daily_scraper.py --mode total